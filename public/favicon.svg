<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Earth Gradient (Vibrant Cyan / Turquoise) -->
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Flame Gradient (Warm Gold, Vivid Orange, Vermilion) -->
    <linearGradient id="flameGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Orbit Ring Color -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Clean Light Squircle Container -->
  <rect width="64" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Orbit Rings Background -->
  <circle cx="32" cy="30" r="23" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="32" cy="30" r="19" fill="none" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Orbit nodes -->
  <circle cx="16" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="48" cy="42" r="1.8" fill="#f97316" />

  <!-- Left: Crescent Earth Globe (Blue / Turquoise) -->
  <path d="M 32 11 A 19 19 0 0 0 32 49 C 39 49 46 41 46 33 C 41 43 27 41 23 33 C 20 27 25 17 32 11 Z" fill="url(#earthGrad)" />
  
  <!-- Earth Continents Texture -->
  <path d="M 23 20 C 26 19 28 22 26 25 C 23 26 21 23 23 20 Z" fill="#ffffff" fill-opacity="0.6" />
  <path d="M 20 28 C 22 27 24 30 22 34 C 19 33 19 29 20 28 Z" fill="#ffffff" fill-opacity="0.5" />

  <!-- Center-Right: Vivid Thermal Flame -->
  <path d="M 33 11 C 36 19 44 23 44 32 C 44 41 37 46 30 46 C 37 44 41 38 39 31 C 37 26 33 22 33 11 Z" fill="url(#flameGrad)" />
  
  <!-- Main Inner Flame Heart -->
  <path d="M 35 18 C 39 24 45 28 45 35 C 45 42 39 47 33 47 C 27 47 24 41 27 35 C 29 30 35 25 35 18 Z" fill="url(#flameGrad)" />

  <!-- Flame Core Highlight -->
  <path d="M 35 27 C 37 31 40 34 40 38 C 40 42 37 44 34 44 C 31 44 30 41 31 38 C 32 35 35 32 35 27 Z" fill="#fef08a" />
</svg>
