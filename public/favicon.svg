<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Earth Peatland Curve (Bottom Left) -->
  <path d="M 6 46 A 28 28 0 0 1 48 58 L 6 58 Z" fill="url(#earthGrad)" />

  <!-- Dual Satellite Orbital Ring (Harmonization Path) -->
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-30 32 32)" stroke-dasharray="72 8" />

  <!-- Satellite Node 1 (MODIS - Terra/Aqua) -->
  <circle cx="14" cy="22" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />

  <!-- Satellite Node 2 (VIIRS - Suomi NPP) -->
  <circle cx="50" cy="42" r="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />

  <!-- Central Thermal Energy Flame & Peat Core -->
  <path d="M 32 14 C 36 22 41 27 41 34 C 41 40 37 45 32 45 C 27 45 23 40 23 34 C 23 27 28 22 32 14 Z" fill="url(#fireGrad)" />
  
  <!-- Inner Flame Hearth -->
  <path d="M 32 26 C 34.5 30 36.5 33 36.5 36.5 C 36.5 39.5 34.5 42 32 42 C 29.5 42 27.5 39.5 27.5 36.5 C 27.5 33 29.5 30 32 26 Z" fill="#fef08a" />
</svg>
