  <!-- Orbital Ellipse -->
  <ellipse cx="60" cy="50" rx="48" ry="18" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="160 30" transform="rotate(-30 60 50)" fill="none" opacity="0.95" />

