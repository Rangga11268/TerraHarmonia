  <path d="M22 68 L78 22 L72 38 L98 12 L72 50 L64 42 Z" fill="#FC3D21" />
  <path d="M42 66 L78 22 L62 48 Z" fill="#E02910" />

  <!-- NASA Bold Typeface -->
