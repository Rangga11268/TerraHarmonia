<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Earth Turquoise/Ocean Gradient -->
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Flame Radiant Warm Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Inner Flame Glow Core -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Outer Orbit Ring Gradient -->
    <linearGradient id="orbitRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- NO BACKGROUND RECTANGLE: 100% TRANSPARENT BACKGROUND -->

  <!-- Outer Satellite Orbital Track 1 -->
  <circle cx="32" cy="32" r="28" stroke="url(#orbitRingGrad)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Outer Satellite Orbital Track 2 (Elliptical Trajectory) -->
  <ellipse cx="32" cy="32" rx="26" ry="16" stroke="url(#orbitRingGrad)" stroke-width="1.5" transform="rotate(-25 32 32)" opacity="0.8" />
  
  <!-- Satellite Sensor Nodes -->
  <circle cx="10" cy="22" r="2.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="54" cy="42" r="2.2" fill="#f97316" stroke="#ffffff" stroke-width="1" />

  <!-- Left: Crescent Earth Globe (Vibrant Turquoise & Continents) -->
  <path d="M 32 8 A 24 24 0 0 0 32 56 C 41 56 49 46 49 36 C 44 48 27 46 22 36 C 18 29 24 16 32 8 Z" fill="url(#earthGrad)" />
  
  <!-- Earth Continent Details -->
  <path d="M 21 21 C 24 20 27 23 25 27 C 22 28 19 25 21 21 Z" fill="#ffffff" fill-opacity="0.75" />
  <path d="M 17 31 C 20 30 22 34 19 38 C 16 37 15 33 17 31 Z" fill="#ffffff" fill-opacity="0.7" />
  <path d="M 25 38 C 28 37 30 42 27 46 C 24 45 23 41 25 38 Z" fill="#ffffff" fill-opacity="0.65" />

  <!-- Center & Right: Iconic Wildfire Flame Motif -->
  <!-- Outer Flame Wing -->
  <path d="M 32 8 C 37 18 47 23 47 34 C 47 45 38 52 29 52 C 38 50 43 43 41 34 C 38 27 33 21 32 8 Z" fill="url(#flameGrad)" />

  <!-- Main Flame Body -->
  <path d="M 35 16 C 41 24 49 29 49 38 C 49 47 42 53 34 53 C 26 53 23 46 27 38 C 30 32 37 26 35 16 Z" fill="url(#flameGrad)" />

  <!-- Inner Luminous Flame Hearth -->
  <path d="M 36 26 C 39 31 43 35 43 40 C 43 45 39 48 35 48 C 31 48 29 45 31 41 C 32 37 36 33 36 26 Z" fill="url(#coreGrad)" />

  <!-- Radiant Core Sparkle -->
  <circle cx="35" cy="42" r="2.5" fill="#ffffff" fill-opacity="0.95" />
</svg>
